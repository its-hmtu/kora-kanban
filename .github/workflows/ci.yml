name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora
          POSTGRES_DB: kora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kora -d kora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kora:kora@localhost:5432/kora
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
      # The e2e API uses its own database. `prisma migrate deploy` also creates a missing database
      # (verified on a fresh Postgres 17), but creating it explicitly keeps CI independent of that.
      - name: Create e2e database
        run: |
          PGPASSWORD=kora psql -h localhost -U kora -d kora -tc "SELECT 1 FROM pg_database WHERE datname = 'kora_e2e'" | grep -q 1 \
            || PGPASSWORD=kora psql -h localhost -U kora -d kora -c 'CREATE DATABASE kora_e2e'
      - run: pnpm --filter @kora/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e -- --project=chromium
