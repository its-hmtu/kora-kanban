name: kora-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
      POSTGRES_DB: kora
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kora -d kora']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

  minio:
    image: minio/minio
    profiles: [minio]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kora-minio
      MINIO_ROOT_PASSWORD: kora-minio-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
